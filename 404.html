<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Matelot</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #0F1115, #161A20); color: #E5E7EB; font-family: 'Montserrat', sans-serif; text-align: center; }
  h1 { font-weight: 300; font-size: 40px; margin: 0 0 12px; } h1 strong { font-weight: 600; }
  p { color: #9CA3AF; font-weight: 300; } a { color: #B0B8C4; }
</style>
</head>
<body>
<div>
  <h1>Page <strong>not found</strong></h1>
  <p>The address may belong to an older documentation version.</p>
  <p><a id="home" href="/">Home</a> · <a id="docs" href="/docs/latest/">Documentation</a></p>
</div>
<script>
  // On <org>.github.io/<repo>/ the site root is /<repo>/; on a custom domain it is /.
  var base = /\.github\.io$/.test(location.hostname) ? '/' + (location.pathname.split('/')[1] || '') + '/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('docs').href = base + 'docs/latest/';
</script>
</body>
</html>
