# Builds the landing page + the committed documentation folders and publishes them to GitHub Pages.
# Runs on every push to main (including the pushes made by the platform's release / docs-sync workflows).
# One-time setup: Settings → Pages → Source: "GitHub Actions". Custom domain: the repository variable SITE_DOMAIN
# (Settings → Secrets and variables → Actions → Variables), e.g. `matelot.io`; empty = https://matelot-io.github.io/website.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/test.mjs
      - run: node tools/build.mjs            # fails on a broken link anywhere in the site
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
